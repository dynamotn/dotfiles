repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
        description: Forces to replace line ending by the UNIX 'lf' character.
      - id: trailing-whitespace
        exclude: .*arkenfox.js$
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.1.1
    hooks:
      - id: betterleaks-system
        pass_filenames: false
  - repo: local
    hooks:
      - id: fish-indent
        name: fish_indent
        entry: fish_indent --check
        language: system
        files: \.fish$
      - id: fish-syntax
        name: fish syntax
        # `fish` runs its first argument and hands it the rest, so check
        # each file in its own call
        entry: bash -c 'for f in "$@"; do fish --no-execute "$f" || exit 1; done' --
        language: system
        files: \.fish$
      - id: dytoy-docs
        name: dytoy docs
        # Rebuild the tool tables of docs/dytoy.md from the definitions; fails
        # when the doc changed, so the regenerated file gets staged
        entry: scripts/dytoy_docs.sh
        language: system
        pass_filenames: false
        files: ^home/\.chezmoitemplates/dytoy/|^docs/dytoy\.(md|extra\.yaml|categories\.yaml)$|^scripts/(lib/)?dytoy_docs\.sh$|^schemas/dytoy
