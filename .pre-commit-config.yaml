repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
        description: Forces to replace line ending by the UNIX 'lf' character.
      - id: trailing-whitespace
        exclude: .*arkenfox.js$
      - id: check-json
        exclude: ^home/.*profiles/
  - repo: local
    hooks:
      - id: shellcheck-system
        name: Lint shell scripts
        description: Static analysis of the bash libraries and entrypoints.
        entry: shellcheck -x -S warning
        language: system
        files: ^scripts/.*\.(sh|bash)$
        exclude: ^scripts/lib/dybatpho/
      - id: shfmt-system
        name: Format shell scripts
        description: Enforce the repository shell formatting style.
        entry: shfmt -i 2 -ci -bn -sr -w
        language: system
        files: ^scripts/.*\.(sh|bash|bats)$
        exclude: ^scripts/lib/dybatpho/
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.1.1
    hooks:
      - id: betterleaks-system
        pass_filenames: false
