[tasks.test]
description = "Run the bats suite"
run = "./scripts/test.sh --all"

[tasks.lint]
description = "Lint and format-check the shell sources"
run = """
#!/usr/bin/env bash
set -Eeuo pipefail
git ls-files 'scripts/*.sh' | xargs shellcheck -x -S warning
git ls-files 'scripts/*.sh' 'scripts/*.bats' 'scripts/*.bash' \
  | xargs shfmt -i 2 -ci -bn -sr -d
"""

[tasks.format]
description = "Rewrite the shell sources in the repository style"
run = """
#!/usr/bin/env bash
set -Eeuo pipefail
git ls-files 'scripts/*.sh' 'scripts/*.bats' 'scripts/*.bash' \
  | xargs shfmt -i 2 -ci -bn -sr -w
"""

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "test"]

# The four images share a single build script; see scripts/docker.sh.
[tasks.docker-enterprise-F1]
description = "Build the F1 enterprise toolbox image"
run = "./scripts/docker.sh enterprise-F1"

[tasks.docker-personal]
description = "Build the personal toolbox image"
run = "./scripts/docker.sh personal"

[tasks.docker-personal-arch]
description = "Build the Arch-based personal toolbox image"
run = "./scripts/docker.sh personal-arch"

[tasks.docker-public]
description = "Build the public toolbox image"
run = "./scripts/docker.sh public"
