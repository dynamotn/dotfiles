#:schema https://raw.githubusercontent.com/yazi-rs/schemas/refs/heads/main/schemas/yazi.json

[mgr]
show_hidden = true
show_symlink = true
linemode = "size"

[plugin]
prepend_previewers = [
  { url = "*/", run = 'piper -- eza --icons -la@ "$1"' },
  { mime = "application/{*zip,*tar,*bzip2,*7z*,*rar,*xz,*zstd,java-archive}", run = "ouch" },
]

[opener]
edit = [{ run = '$EDITOR "$@"', block = true, for = "unix" }]
extract = [
  { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
  { run = 'ouch d -y "$@"', desc = "Extract here with ouch", for = "unix" },
]
