#:schema https://raw.githubusercontent.com/yazi-rs/schemas/refs/heads/main/schemas/keymap.json
[mgr]
prepend_keymap = [
  { on = [
    "c",
    "a",
  ], run = "plugin ouch", desc = "Compress with ouch" },
  # The rest of Neovim's motions (hjkl, gg/G, C-u/d/f/b) are yazi defaults.
  { on = "<C-e>", run = "arrow 1", desc = "Next file, like Neovim's C-e" },
  { on = "<C-y>", run = "arrow -1", desc = "Previous file, like Neovim's C-y" },
]
