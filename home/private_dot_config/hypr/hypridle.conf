general {
  lock_cmd = pidof hyprlock || hyprlock && loginctl unlock-session
  unlock_cmd = ~/.config/eww/scripts/idle.sh close && notify-send "Unlocked"
  before_sleep_cmd = ~/.config/eww/scripts/idle.sh open && notify-send "Zzz"
  after_sleep_cmd = notify-send "Awake!"
  ignore_dbus_inhibit = false
  ignore_systemd_inhibit = false
}

# The eww idle screen is a cover, not a lock: it shows the clock and what is
# playing while the session is still unlocked, and hyprlock takes over below.
listener {
  timeout = 90 # 1.5 mins
  on-timeout = ~/.config/eww/scripts/idle.sh open
  on-resume = ~/.config/eww/scripts/idle.sh close
}

listener {
  timeout = 180 # 3 mins
  on-timeout = loginctl lock-session
}

listener {
  timeout = 300 # 5 mins
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

listener {
  timeout = 540 # 10 mins
  on-timeout = loginctl suspend
}
