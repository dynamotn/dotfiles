# Vim-style keys, matching the Neovim config; every other default stays.
# The defaults these take over move next to them: subtitle cycling from j/J
# to Alt+j/Alt+J, the A-B loop from l to Alt+l, file looping from L to Alt+L.
h seek -5
l seek 5
k add volume 2
j add volume -2
# Like S-h/S-l between buffers.
H playlist-prev
L playlist-next
Alt+j cycle sub
Alt+J cycle sub down
Alt+l ab-loop
Alt+L cycle-values loop-file inf no
