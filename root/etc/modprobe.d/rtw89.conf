# Realtek rtw89 Wi-Fi (RTL8852CE on b0n9u4) drops off the network after
# suspend: the card fails to wake from PCIe ASPM L1/L1SS ("RXDCK timeout") and
# from its firmware power save. Keep both off. Ignored without an rtw89 card.
options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y
options rtw89_core disable_ps_mode=y
