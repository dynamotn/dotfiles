# Watch every SATA and NVMe disk: all SMART attributes and error logs, a
# short self-test each night at 02:00 and a long one on Saturdays at 03:00,
# and a warning at 55°C, critical at 65°C. Disks in standby are not woken.
# Findings go to syslog / the journal (`journalctl -u smartd` or
# /var/log/messages), and once per problem to the desktop, through
# /usr/local/bin/notify-desktop instead of mail.
DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/03) -W 4,55,65 -m <nomailer> -M exec /usr/local/bin/notify-desktop
