# Editors, language servers, file watchers and dev servers put an inotify
# watch on every directory of a project; a monorepo or node_modules tree runs
# past the default 8192 and watching silently stops.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Electron apps, JVMs, Elasticsearch and Proton games map more regions than
# the default 65530 allows, and crash when they hit it.
vm.max_map_count = 1048576
