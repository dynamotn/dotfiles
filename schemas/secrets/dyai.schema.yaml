title: Secrets dyai
description: >
  The crew store's keys of each machine, keyed by its code: read at apply time
  by home/.chezmoitemplates/dyai/node-key.tmpl into ~/.config/dyai/node/
  (docs/dyai-store.md in scripts/lib/dyai). The signing key's public half also
  goes into nodes/allowed_signers on the store's main branch, under the same
  code; the deploy key is registered on the store project with write access.
type: object
required: [nodes]
additionalProperties: false
properties:
  nodes:
    type: object
    propertyNames: { pattern: "^[A-Za-z0-9_-]+$" }
    additionalProperties:
      type: object
      required: [signing, public]
      additionalProperties: false
      properties:
        signing:
          type: string
          # PRIV[A]TE: the marker spelled out trips the leak scanners on this schema.
          pattern: "^-----BEGIN OPENSSH PRIV[A]TE KEY-----"
          description: OpenSSH private key, without a passphrase (dyai signs unattended)
        public:
          type: string
          pattern: "^ssh-ed25519 "
          description: Its public half, as ssh-keygen writes it to the .pub file
        deploy:
          type: string
          pattern: "^-----BEGIN OPENSSH PRIV[A]TE KEY-----"
          description: SSH key the store is pushed to with, a deploy key of the store project
        deploy_public:
          type: string
          pattern: "^ssh-ed25519 "
          description: Its public half
