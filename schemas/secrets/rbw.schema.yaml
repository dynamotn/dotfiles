title: Secrets RBW
description: >
  Bitwarden account of a dybw profile, rendered into ~/.config/dybw/config.toml
  by home/.chezmoitemplates/dybw/config.toml.tmpl (the file keeps rbw's name and
  keys). dybw derives the identity server from base_url, so identity_url must be
  null or <base_url>/identity; lock_timeout becomes lock_timeout_minutes,
  rounded up.
type: object
required: [email, base_url, lock_timeout]
additionalProperties: false
properties:
  email:
    type: string
    description: Bitwarden account email address
  base_url:
    type: string
    description: Self-hosted Vaultwarden/Bitwarden server URL
  identity_url:
    oneOf:
      - type: "null"
      - type: string
        description: Override identity server URL (leave null to derive from base_url)
  lock_timeout:
    type: integer
    description: Idle timeout in seconds before the vault auto-locks
