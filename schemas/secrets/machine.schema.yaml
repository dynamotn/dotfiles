title: Secrets Machine
description: >
  The secrets of each machine, keyed by its code: read at apply time by
  home/.chezmoitemplates/machine/secret.tmpl
type: object
required: [machines]
additionalProperties: false
properties:
  machines:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        httpProxy:
          type: string
          description: HTTP(S) proxy address, empty for none
        noProxyAddresses:
          type: array
          description: Addresses reached without the proxy
          items:
            type: string
        customHostname:
          type: string
          description: Hostname of the machine, empty to use its code
