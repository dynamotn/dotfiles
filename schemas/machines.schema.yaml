# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
title: Machine Answers
description: >
  Schema for home/.chezmoidata/machines.yaml, the answers the config template
  (.chezmoi.yaml.tmpl) takes instead of asking, per machine code. Every field
  is optional; one left out is asked. The secrets of a machine (httpProxy,
  noProxyAddresses, customHostname) are rejected here, as they belong to
  secrets/data/<identity>/machine.yaml.age.
type: object
required: [machines]
additionalProperties: false

$defs:
  company:
    type: string
    enum: [F1, T1, ZOO, U3T]

properties:
  machines:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        place:
          type: string
          enum: [cloud, home, office, mobility]
        kind:
          type: string
          enum: [container, pc, laptop, workstation, tablet, mobile, vm, sbc]
        company:
          description: Owner company, read on office machines only
          oneOf:
            - $ref: "#/$defs/company"
            - type: "null"
        decryptPersonal:
          type: boolean
        decryptEnterprise:
          type: array
          items:
            $ref: "#/$defs/company"
        guiServer:
          type: string
          enum: ["0", W, X, M]
          description: W for Wayland, X for XOrg, M for Mac, 0 for CLI-only
        guiDriver:
          type: string
          enum: [N, I, A, M, V]
          description: N for Nvidia, I for Intel, A for AMD, M for Mac, V for virtual
        guiWinManager:
          type: string
          enum: [H, N, A, O, G]
          description: H for hyprland, N for niri, A for aerospace, O for omniwm, G for gnome
        languages:
          type: array
          items:
            type: string
            enum: [vi, ja, zh]
        browser:
          type: string
          enum: [Z, F, ""]
          description: Z for Zen Browser, F for Firefox, empty for none
        browserEnterpriseProfiles:
          type: array
          items:
            $ref: "#/$defs/company"
        mailClient:
          type: string
          enum: [B, T, ""]
          description: B for Betterbird, T for Thunderbird, empty for none
        mailEnterpriseProfiles:
          type: array
          items:
            $ref: "#/$defs/company"
        terminalMultiplexer:
          type: string
          enum: [Z, T]
          description: Z for Zellij, T for tmux
        hasSound:
          type: boolean
        hasBluetooth:
          type: boolean
        hasWifi:
          type: boolean
        preferGitSSH:
          type: boolean
        blockedGitlab:
          type: boolean
        darkMode:
          type: boolean
