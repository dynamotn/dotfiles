# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
title: Machine Answers
description: >
  Schema for home/.chezmoidata/machines.yaml, the answers the config template
  (.chezmoi.yaml.tmpl) takes instead of asking, per machine code. Every field
  is optional; one left out is asked. Which values a choice may take is not
  repeated here: the config template checks them against choices.yaml and
  companies.yaml. The secrets of a machine (httpProxy, noProxyAddresses,
  customHostname) are rejected, as they belong to
  secrets/data/<identity>/machine.yaml.age.
type: object
required: [machines]
additionalProperties: false

$defs:
  choice:
    type: string
  choices:
    type: array
    items:
      type: string

properties:
  machines:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        place:
          $ref: "#/$defs/choice"
        kind:
          $ref: "#/$defs/choice"
        company:
          description: Owner company, read on office machines only
          oneOf:
            - type: string
            - type: "null"
        decryptPersonal:
          type: boolean
        decryptEnterprise:
          $ref: "#/$defs/choices"
        guiServer:
          $ref: "#/$defs/choice"
        guiDriver:
          $ref: "#/$defs/choice"
        guiWinManager:
          $ref: "#/$defs/choice"
        languages:
          $ref: "#/$defs/choices"
        browser:
          $ref: "#/$defs/choice"
        browserEnterpriseProfiles:
          $ref: "#/$defs/choices"
        mailClient:
          $ref: "#/$defs/choice"
        mailEnterpriseProfiles:
          $ref: "#/$defs/choices"
        terminalMultiplexer:
          $ref: "#/$defs/choice"
        hasSound:
          type: boolean
        hasBluetooth:
          type: boolean
        hasWifi:
          type: boolean
        preferGitSSH:
          type: boolean
        darkMode:
          type: boolean
