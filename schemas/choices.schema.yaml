# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
title: Choice Options
description: >
  Schema for home/.chezmoidata/choices.yaml, the options of each choice
  question of the config template (.chezmoi.yaml.tmpl), in the order offered.
type: object
required: [choices]
additionalProperties: false

properties:
  choices:
    type: object
    required:
      - place
      - kind
      - guiServer
      - guiDriver
      - guiWinManager
      - languages
      - browser
      - mailClient
      - terminalMultiplexer
    additionalProperties:
      type: object
      required: [options]
      additionalProperties: false
      properties:
        options:
          type: array
          minItems: 1
          description: The options in the order offered; "" stands for none
          items:
            type: string
        default:
          type: string
          description: The default option, the first one when left out
        labels:
          type: object
          description: What an option means, shown as "<option> for <label>"
          additionalProperties:
            type: string
