# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
title: dyai Shared AI-agent Config
description: >
  Schema for ~/.config/dyai/config.yaml, the single declarative source the
  AI setup hook reads to install AI-agent extensions and settings. `global`
  holds what is shared across agents; `agents.<name>` holds what is specific
  to one agent.
type: object
additionalProperties: false

definitions:
  mcpServer:
    type: object
    additionalProperties: false
    description: One MCP server, translated into each agent's own config format.
    properties:
      command:
        type: string
        description: Executable for a stdio server.
      args:
        type: array
        items: { type: string }
      env:
        type: object
        description: >
          Environment for the subprocess. Holds key names and non-secret
          values only; never a credential value.
        additionalProperties: { type: string }
      readonly:
        type: boolean
        description: >
          The server has no side effects and keeps no state between calls, so
          agents that support it may call its tools in parallel (Codex only).
      url:
        type: string
        description: Endpoint for an HTTP server (mutually exclusive with command).
      headers:
        type: object
        additionalProperties: { type: string }
      timeout: { type: integer }
      connect_timeout: { type: integer }

  preset:
    type: object
    additionalProperties: false
    description: A registry preset — the extensions `dyai use <name>` pulls into a project.
    properties:
      subagents:
        type: array
        items: { type: string }
        description: Subagent leaf names, installed from the global.subagents source.
      skills:
        type: array
        items: { type: string }
      mcp:
        type: object
        additionalProperties: { $ref: "#/definitions/mcpServer" }
      commands:
        type: array
        items: { type: string }
      plugins:
        type: array
        items: { type: string, pattern: "^[^@\\s]+@[^@\\s]+$" }
        description: >
          Claude plugins (plugin@marketplace) enabled in the project's
          .claude/settings.local.json; list them in agents.claude.optional_plugins
          so they are installed but off everywhere else.

  mdSource:
    type: object
    additionalProperties: false
    description: >
      A repo of .md files (subagents or commands), pinned by ref, with the
      directories or files to install from.
    required: [repo, ref, include]
    properties:
      repo: { type: string, description: "owner/repo on GitHub" }
      ref: { type: string, description: "a commit SHA or tag, never a moving branch" }
      include:
        type: array
        items: { type: string }
        description: >
          Entries to install from: a directory (its *.md except README) or a
          single *.md file.
      exclude:
        type: array
        items: { type: string }
        description: >
          Subagent leaf names to skip in the global install (a preset can still
          pull them per project).

  hook:
    type: object
    additionalProperties: false
    required: [event, run]
    properties:
      event:
        type: string
        description: Abstract event name, translated to each agent's hook model.
      run:
        type: string
        description: Command to run on the event.

  policy:
    type: object
    additionalProperties: true
    description: Shared settings translated into each agent's settings file.
    properties:
      permissions: { type: object }
      model: { type: [string, "null"] }
      theme: { type: string }
      effortLevel: { type: string }

properties:
  global:
    type: object
    additionalProperties: false
    properties:
      skills:
        type: array
        items: { type: string }
        description: skills.sh entries installed for every agent.
      subagents:
        type: array
        items: { $ref: "#/definitions/mdSource" }
      commands:
        type: array
        items: { $ref: "#/definitions/mdSource" }
        description: Pinned repos of command .md files, installed to project command dirs by presets.
      mcp:
        type: object
        additionalProperties: { $ref: "#/definitions/mcpServer" }
      hooks:
        type: object
        additionalProperties: { $ref: "#/definitions/hook" }
      lsp:
        type: object
        additionalProperties: false
        description: >
          Neovim's configured language servers, shared with every agent
          (dyai-lsp).
        properties:
          exclude:
            type: array
            items: { type: string }
            description: Server names never shared with any agent.
          serena:
            type: object
            additionalProperties: false
            description: >
              The serena MCP bridge Codex, Gemini and agy use for the
              languages Claude's LSP plugin covers natively.
            properties:
              ref: { type: string, description: "serena commit SHA, never a moving branch" }
              contexts:
                type: object
                description: serena --context value, keyed by agent id.
                additionalProperties: { type: string }
      installers:
        type: object
        description: >
          Per-agent install commands run once by `dyai install` (for a tool with
          its own installer, e.g. a memory plugin). Keyed by installer name.
        additionalProperties:
          type: object
          additionalProperties: false
          required: [commands]
          properties:
            commands:
              type: object
              description: >
                Shell command to run for each agent id, run once when that
                agent's launcher is present. Keyed by agent id.
              additionalProperties: { type: string }
      policy: { $ref: "#/definitions/policy" }

  agents:
    type: object
    description: Per-agent specifics, keyed by agent name.
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        marketplaces:
          type: object
          description: Claude plugin marketplaces (Claude only).
          additionalProperties:
            type: object
            required: [source]
            properties:
              source:
                type: object
                required: [source]
                properties:
                  source: { type: string, enum: [github, git] }
                  repo: { type: string }
                  url: { type: string }
        plugins:
          type: array
          items: { type: string }
          description: Enabled plugins, as plugin@marketplace (Claude only).
        optional_plugins:
          type: array
          items: { type: string }
          description: >
            Plugins installed but disabled globally (Claude only); a registry
            preset's `plugins` switches them on per project.
        mcp:
          type: object
          additionalProperties: { $ref: "#/definitions/mcpServer" }
        hooks:
          type: object
          additionalProperties: { $ref: "#/definitions/hook" }
        policy: { $ref: "#/definitions/policy" }

  registry:
    type: object
    additionalProperties: false
    description: Opt-in presets pulled per project by `dyai use <name>`.
    properties:
      languages:
        type: object
        additionalProperties: { $ref: "#/definitions/preset" }
      infra:
        type: object
        additionalProperties: { $ref: "#/definitions/preset" }
      presets:
        type: object
        additionalProperties: { $ref: "#/definitions/preset" }
