# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
title: dyai Shared AI-agent Config
description: >
  Schema for ~/.config/dyai/config.yaml, the single declarative source the
  AI setup hook reads to install AI-agent extensions and settings. `global`
  holds what is shared across agents; `agents.<name>` holds what is specific
  to one agent.
type: object
additionalProperties: false

$defs:
  mcpServer:
    type: object
    additionalProperties: false
    description: One MCP server, translated into each agent's own config format.
    properties:
      command:
        type: string
        description: Executable for a stdio server.
      args:
        type: array
        items: { type: string }
      env:
        type: object
        description: >
          Environment for the subprocess. Holds key names and non-secret
          values only; never a credential value.
        additionalProperties: { type: string }
      readonly:
        type: boolean
        description: >
          The server has no side effects and keeps no state between calls, so
          agents that support it may call its tools in parallel (Codex only).
      url:
        type: string
        description: Endpoint for an HTTP server (mutually exclusive with command).
      headers:
        type: object
        additionalProperties: { type: string }
      timeout: { type: integer }
      connect_timeout: { type: integer }

  preset:
    type: object
    additionalProperties: false
    description: A registry preset — the extensions `dyai use <name>` pulls into a project.
    properties:
      subagents:
        type: array
        items: { type: string }
        description: Subagent leaf names, installed from the global.subagents source.
      skills:
        type: array
        items: { type: string }
      mcp:
        type: object
        additionalProperties: { $ref: "#/$defs/mcpServer" }
      commands:
        type: array
        items: { type: string }
      plugins:
        type: array
        items: { type: string, pattern: "^[^@\\s]+@[^@\\s]+$" }
        description: >
          Claude plugins (plugin@marketplace) enabled in the project's
          .claude/settings.local.json; list them in agents.claude.optional_plugins
          so they are installed but off everywhere else.

  mdSource:
    type: object
    additionalProperties: false
    description: >
      A repo of .md files (subagents or commands), pinned by ref, with the
      directories or files to install from.
    required: [repo, ref, include]
    properties:
      repo: { type: string, description: "owner/repo on GitHub" }
      ref: { type: string, description: "a commit SHA or tag, never a moving branch" }
      include:
        type: array
        items: { type: string }
        description: >
          Entries to install from: a directory (its *.md except README) or a
          single *.md file.
      exclude:
        type: array
        items: { type: string }
        description: >
          Subagent leaf names to skip in the global install (a preset can still
          pull them per project).
      models:
        type: object
        description: >
          Subagent leaf name to an abstract tier. Each agent translates the
          tier through its own agents.<name>.model_tiers; `inherit` keeps the
          session's model. An agent with no entry for the tier keeps the
          upstream choice.
        additionalProperties: { $ref: "#/$defs/modelTier" }

  crewAgent:
    enum: [claude, codex, gemini, opencode, copilot]
    description: An agent CLI dyai crew can drive headless.

  modelTier:
    enum: [fast, standard, strong, inherit]
    description: Abstract model tier, translated per agent by agents.<name>.model_tiers.

  modelChoice:
    description: >
      One agent's own way to name a model: a string in that agent's syntax
      (Claude `opus`, opencode `ollama/qwen3-coder`), or an object for agents
      that split model, provider and reasoning effort (Codex, a self-hosted
      Ollama or LM Studio provider).
    oneOf:
      - type: string
      - type: object
        additionalProperties: false
        required: [model]
        properties:
          model: { type: string }
          provider:
            type: string
            description: Provider id as the agent names it, e.g. ollama, lmstudio.
          effort:
            type: string
            description: Reasoning effort, for agents that take one.

  hook:
    type: object
    additionalProperties: false
    required: [event, run]
    properties:
      event:
        type: string
        description: Abstract event name, translated to each agent's hook model.
      run:
        type: string
        description: Command to run on the event.

  policy:
    type: object
    additionalProperties: true
    description: Shared settings translated into each agent's settings file.
    properties:
      permissions: { type: object }
      model: { type: [string, "null"] }
      theme: { type: string }
      effortLevel: { type: string }

properties:
  global:
    type: object
    additionalProperties: false
    properties:
      skills:
        type: array
        items: { type: string }
        description: skills.sh entries installed for every agent.
      subagents:
        type: array
        items: { $ref: "#/$defs/mdSource" }
      commands:
        type: array
        items: { $ref: "#/$defs/mdSource" }
        description: Pinned repos of command .md files, installed to project command dirs by presets.
      mcp:
        type: object
        additionalProperties: { $ref: "#/$defs/mcpServer" }
      hooks:
        type: object
        additionalProperties: { $ref: "#/$defs/hook" }
      lsp:
        type: object
        additionalProperties: false
        description: >
          Neovim's configured language servers, shared with every agent
          (dyai-lsp).
        properties:
          exclude:
            type: array
            items: { type: string }
            description: Server names never shared with any agent.
          serena:
            type: object
            additionalProperties: false
            description: >
              The serena MCP bridge Codex, Gemini and agy use for the
              languages Claude's LSP plugin covers natively.
            properties:
              ref: { type: string, description: "serena commit SHA, never a moving branch" }
              contexts:
                type: object
                description: serena --context value, keyed by agent id.
                additionalProperties: { type: string }
      installers:
        type: object
        description: >
          Per-agent install commands run once by `dyai install` (for a tool with
          its own installer, e.g. a memory plugin). Keyed by installer name.
        additionalProperties:
          type: object
          additionalProperties: false
          required: [commands]
          properties:
            commands:
              type: object
              description: >
                Shell command to run for each agent id, run once when that
                agent's launcher is present. Keyed by agent id.
              additionalProperties: { type: string }
      policy: { $ref: "#/$defs/policy" }
      crew:
        type: object
        additionalProperties: false
        description: >
          `dyai run` / `review` / `merge`: headless agent CLIs working in their
          own git worktrees, reviewed by another provider before a merge.
        properties:
          fallback:
            type: array
            items: { $ref: "#/$defs/crewAgent" }
            description: Order `--agent auto` tries.
          reviewer:
            type: object
            description: Reviewer agent for each writer agent.
            propertyNames: { $ref: "#/$defs/crewAgent" }
            additionalProperties: { $ref: "#/$defs/crewAgent" }
          model:
            type: object
            description: Model string passed with each agent's model flag.
            propertyNames: { $ref: "#/$defs/crewAgent" }
            additionalProperties: { type: string }
          timeout: { type: integer, minimum: 1, description: "Seconds per run" }
          cooldown:
            type: integer
            minimum: 0
            description: Seconds an agent is skipped after a rate limit or an auth failure.
          gate: { type: string, description: "Shell command a merge must pass before it commits" }
          require_review: { type: boolean }
          panes:
            enum: [auto, "off"]
            description: >
              auto opens a zellij pane per started worker and per review
              (dyai_zellij::open); off opens none.
          fences:
            type: array
            items: { type: string }
            description: >
              Git pathspecs a merge never takes automatically. Glob entries
              carry the :(glob) magic.
          hooks:
            type: object
            additionalProperties: false
            properties:
              post_create: { type: string, description: "Run in a new task worktree" }
              on_status: { type: string, description: "Run after every status change" }

  agents:
    type: object
    description: Per-agent specifics, keyed by agent name.
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        marketplaces:
          type: object
          description: Claude plugin marketplaces (Claude only).
          additionalProperties:
            type: object
            required: [source]
            properties:
              source:
                type: object
                required: [source]
                properties:
                  source: { type: string, enum: [github, git] }
                  repo: { type: string }
                  url: { type: string }
        plugins:
          type: array
          items: { type: string }
          description: Enabled plugins, as plugin@marketplace (Claude only).
        optional_plugins:
          type: array
          items: { type: string }
          description: >
            Plugins installed but disabled globally (Claude only); a registry
            preset's `plugins` switches them on per project.
        mcp:
          type: object
          additionalProperties: { $ref: "#/$defs/mcpServer" }
        hooks:
          type: object
          additionalProperties: { $ref: "#/$defs/hook" }
        policy: { $ref: "#/$defs/policy" }
        model_tiers:
          type: object
          description: >
            This agent's model for each abstract tier. `inherit` needs no
            entry: it always means the session's own model.
          propertyNames: { enum: [fast, standard, strong] }
          additionalProperties: { $ref: "#/$defs/modelChoice" }

  registry:
    type: object
    additionalProperties: false
    description: Opt-in presets pulled per project by `dyai use <name>`.
    properties:
      languages:
        type: object
        additionalProperties: { $ref: "#/$defs/preset" }
      infra:
        type: object
        additionalProperties: { $ref: "#/$defs/preset" }
      presets:
        type: object
        additionalProperties: { $ref: "#/$defs/preset" }
